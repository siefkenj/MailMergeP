# Build and test the extension inside the dev container (see .devcontainer/), so CI
# runs in the same environment as development.

name: Build

on:
    pull_request:
        branches: ["master"]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # Builds the dev container, whose postCreateCommand installs the npm dependencies
            # and the browser for the end-to-end tests, then runs the checks inside it.
            - name: Build and test in the dev container
              uses: devcontainers/ci@v0.3
              with:
                  push: never
                  env: |
                      CI=true
                  runCmd: >-
                      npm run typecheck &&
                      npm run lint &&
                      npm test &&
                      npm run test:e2e &&
                      npm run build-and-package

            - name: Upload the end-to-end test report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  if-no-files-found: ignore
