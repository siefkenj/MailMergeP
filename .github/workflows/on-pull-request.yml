# Build and test the extension inside the dev container (see .devcontainer/), so CI
# runs in the same environment as development.

name: Build

on:
    pull_request:
        branches: ["master"]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # Builds the dev container, whose postCreateCommand installs the npm dependencies,
            # Firefox, Thunderbird and Mailpit for the end-to-end tests, then runs the checks
            # inside it. `test:thunderbird` also builds and packages the add-on.
            - name: Build and test in the dev container
              uses: devcontainers/ci@v0.3
              with:
                  push: never
                  env: |
                      CI=true
                  runCmd: >-
                      npm run typecheck &&
                      npm run lint &&
                      npm test &&
                      npm run test:e2e &&
                      npm run test:thunderbird

            # Screenshots of the add-on in Thunderbird, taken during the tests, including
            # the ones for the add-on's listing on addons.thunderbird.net
            - name: Upload screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: thunderbird-screenshots
                  path: test-results-thunderbird/screenshots/
                  if-no-files-found: ignore

            - name: Upload the add-on
              uses: actions/upload-artifact@v4
              with:
                  name: mailmergep-addon
                  path: mailmergep@example.net-latest.xpi

            - name: Upload the test reports and logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: |
                      playwright-report/
                      playwright-report-thunderbird/
                      test-results-thunderbird/
                  if-no-files-found: ignore
